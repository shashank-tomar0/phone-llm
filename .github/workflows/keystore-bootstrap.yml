name: Keystore bootstrap (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore phonellm-release.jks \
            -storetype JKS \
            -alias phonellm \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=PhoneLM, OU=Mobile, O=PhoneLM, L=Unknown, ST=Unknown, C=IN"
          base64 -w0 phonellm-release.jks > phonellm-release.jks.b64
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: phonellm-release.jks.b64
          retention-days: 1
